name: portfolio

services:
  web:
    image: ${IMAGE:-ghcr.io/chishty313/devops-themed-personal-portfolio:latest}
    container_name: portfolio-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    # No public port binding — the shared Caddy (in timetrack-prod_default)
    # reaches us over docker DNS as `portfolio-web:3000`.
    # 127.0.0.1 mapping is kept for on-host debugging (curl 127.0.0.1:3000/).
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  # External network created by the timetrack-prod stack — this container
  # joins it so the shared Caddy can reach us. `external: true` means
  # `docker compose down` will NOT remove the network.
  proxy:
    external: true
    name: timetrack-prod_default
