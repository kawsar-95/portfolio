# Append this block to /etc/caddy/Caddyfile on the server (as root, via sudo).
# It lives ALONGSIDE the existing `:80 { ... }` and `ci.niftyhq.ai { ... }` blocks;
# do NOT delete them. Caddy matches hostnames first, so this block only handles
# requests for chishty.me / www.chishty.me.
#
# After editing, run:
#   sudo caddy validate --config /etc/caddy/Caddyfile
#   sudo systemctl reload caddy
#   (if caddy is stopped: sudo systemctl start caddy)

chishty.me, www.chishty.me {
	encode zstd gzip

	@static path /_next/static/* /static/* /favicon.ico /icon.svg /robots.txt /sitemap.xml
	header @static Cache-Control "public, max-age=31536000, immutable"

	reverse_proxy 127.0.0.1:3000 {
		header_up X-Real-IP {remote_host}
		header_up X-Forwarded-Proto {scheme}
	}
}
